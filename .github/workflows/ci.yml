name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, lint, format and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats

      - name: Bash syntax
        run: |
          find src -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          find src -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Formatting
        run: shfmt -d -i 2 -ci src

      - name: Bats
        run: bats tests
